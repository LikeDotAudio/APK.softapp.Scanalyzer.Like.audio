# YOUTUBE_AUDIO — a song from a YouTube link, for the Song Analyzer.
# Published to MQTT (retained) by apk_plugin_runner at: APK.audio/System/Protocols/youtube_audio/config
[youtube_audio]
# How this is raised (contracts/DISCOVERY-LIFECYCLE.md, stage 2): compose = up for as
# long as its stack is up; the discovery engine does not supervise it.
raise = compose
enabled = true
#
# A job arrives on APK.audio/System/Protocols/youtube_audio/outgoing/job (not retained):
#   {"job_id": "...", "op": "fetch", "url": "https://www.youtube.com/watch?v=..."}
# The answer goes to .../youtube_audio/incoming/result (not retained) with the same
# job_id. The audio is never on the bus: it is PUT to the file store and the answer
# carries its url, title, uploader and duration.
#
# ---------------------------------------------------------------- the link
# The hosts a link may name (or a subdomain of one: www., m., music.), comma separated.
allowed_hosts = youtube.com, youtu.be, youtube-nocookie.com
# The job as JSON, and its url, at most.
max_job_bytes = 16384
max_url_chars = 2048
#
# ---------------------------------------------------------------- the fetch
# yt-dlp's format choice: audio only, never re-encoded. AAC in .m4a first (every
# browser decodes it), then Opus, then whatever audio there is.
audio_format = bestaudio[ext=m4a]/bestaudio[acodec=opus]/bestaudio
# The longest video fetched, in seconds, and the most audio, in bytes (the store
# caps a file at 128 MiB). Both are refused before the audio is downloaded.
max_duration_s = 3600
max_audio_bytes = 125829120
# One stalled read, in seconds.
fetch_timeout_s = 60
# Where the stream lands before it is PUT: the container's tmpfs.
work_dir = /tmp
#
# ---------------------------------------------------------------- the file store
# PUT <origin><path><job_id>.<ext>, in-network on Storage-Portal
# (DATABASE.server.SQL nginx.conf, the /api/files/ location: no overwrite, 128 MiB).
file_store_origin = http://Storage-Portal
file_store_path = /api/files/youtube_audio/
put_timeout_s = 120
