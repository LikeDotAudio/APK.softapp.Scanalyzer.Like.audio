[package]
name = "apkaudio-folder-scanner"
version = "0.1.0"
edition = "2021"
description = "Parallel folder walk -> one FileRecord per file -> dataset_catalog.json"

[[bin]]
name = "apkaudio_folder_scanner"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"

[profile.release]
opt-level = 3
