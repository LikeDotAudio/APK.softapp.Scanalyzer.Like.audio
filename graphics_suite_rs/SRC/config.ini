# GRAPHICS_SUITE — Scanalyzer's graphics suite (OCR, raster→SVG) as a worker.
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/graphics_suite/config
[graphics_suite]
enabled = true
# A job arrives on APK.audio/System/Protocols/graphics_suite/outgoing/job (not
# retained) as JSON:
#   {"job_id": "...", "op": "ocr" | "vectorize", "filename": "page.png",
#    "content_b64": "<the image bytes>", "threshold": 128}
# `threshold` (0-255, vectorize only) is the luminance below which a pixel is ink.
# The answer goes to APK.audio/System/Protocols/graphics_suite/incoming/result
# (not retained), carrying the same job_id: for "ocr" the OcrResult the CLI's
# `ocr` prints, for "vectorize" the SvgConversionResult `to-svg` prints.
# A job whose image is larger than this many bytes (decoded) is answered with
# an error rather than read.
max_job_bytes = 33554432
# Neither side of the image may be longer than this many pixels: a small PNG
# can declare a huge canvas, and both passes hold several bytes per pixel.
max_side_px = 8192
# A vectorize answer whose SVG is longer than this many bytes is answered with
# an error (a noisy photo traces into a path per speck): raise the threshold.
max_result_bytes = 33554432
