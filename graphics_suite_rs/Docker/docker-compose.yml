# Worker-GRAPHICS_SUITE — Scanalyzer's OCR (CAPTURE.OCR) and raster→SVG tracer
# (CAPTURE.Vectorizer), answering jobs on the bus (LOOSE-workers-convert-rest).
#     docker compose -f 'PODS/POD.workers/Docker/docker-compose.yml' up -d --build
# Mountable on its own as well; it then lands in the same `workers` project:
#     docker compose -f 'PODS/POD.THIN/Softapps/SCANALYZER_SUITE/SCANALYZER.Like.audio/graphics_suite_rs/Docker/docker-compose.yml' up -d --build
#
# WHY THIS STACK IS IN graphics_suite_rs/ AND NOT IN THE REPO'S Docker/: that
# one is the corpus API (Scanalyzer-API), project `apk-audio`, and a compose
# file has one project. A worker joins `workers`. The tool is graphics_suite_rs,
# so its worker stands beside it — the CAPTURE.OCR and CAPTURE.Vectorizer
# repositories are pointers to this code and hold none.
#
# A job: publish JSON to APK.audio/System/Protocols/graphics_suite/outgoing/job
#     {"job_id": "<yours>", "op": "ocr" | "vectorize", "filename": "page.png",
#      "content_b64": "<the image bytes>", "threshold": 128,
#      "psm": 8, "whitelist": "ABCDEFGHIJKLMNOPQRSTUVWXYZ-"}
#     (threshold for vectorize only; psm/whitelist for ocr only; never a path)
# The answer, with the same job_id, on .../graphics_suite/incoming/result.
# Its self-description, retained, on .../graphics_suite/incoming/api.
#
# NO PORT. The bus is the only door, which is the point of a worker.

# ONE PROJECT FOR THE POD — every worker stack declares it, so a stack brought
# up alone joins the pod rather than opening a project beside it.
name: workers

services:
  graphics-suite:
    build:
      # The repo root, counted from THIS file's real path (PODS/README.md
      # rule 2): Docker → graphics_suite_rs → SCANALYZER.Like.audio →
      # SCANALYZER_SUITE → Softapps → POD.THIN → PODS → root.
      context: "../../../../../../.."
      dockerfile: "PODS/POD.THIN/Softapps/SCANALYZER_SUITE/SCANALYZER.Like.audio/graphics_suite_rs/Docker/Dockerfile"
    image: worker-graphics-suite:local
    container_name: Worker-GRAPHICS_SUITE
    restart: unless-stopped
    labels:
      audio.apk.purpose: "worker: OCR or SVG-traces an image posted as a job on graphics_suite/outgoing/job"
    # Nothing to ask for: no port, no device, no raw socket. The image runs as
    # an unprivileged user with no file capabilities, so no-new-privileges
    # costs nothing here (unlike the plugins, see plugin-base.yml).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # The runner's health file is the only thing written: a job is decoded and
    # read in memory, never staged.
    tmpfs:
      - /tmp:size=1m
    environment:
      # THE BROKER BY NAME on Broker-Mosquitto's network, as plugin-bridge in
      # DISCOVERY.Engine/Docker/plugin-base.yml does (PLAN-3378.01): the host
      # port is loopback-only, and `broker` is the alias it answers to there.
      MQTT_HOST: ${APK_WORKER_MQTT_HOST:-broker}
      MQTT_PORT: ${APK_WORKER_MQTT_PORT:-1883}
      APK_MQTT_USERNAME: ${APK_MQTT_USERNAME:-}
      APK_MQTT_PASSWORD: ${APK_MQTT_PASSWORD:-}
      APK_NODE: ${APK_NODE:-}
      APK_IMAGE_REV: ${APK_IMAGE_REV:-unstamped}
    networks: [default, bus]
    healthcheck:
      # The runner's probe: the timestamp its tick writes into /tmp. The job
      # loop ticks on every broker event, keep-alive pings included.
      test: ["CMD", "apk-plugin-health"]
      interval: 60s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

# Every worker stack repeats this block verbatim; `include:` merges top-level
# sections and an identical declaration is what makes that merge a no-op.
networks:
  default:
    name: workers
  # Broker-Mosquitto's network (project apk-audio). The broker is protected and
  # brought up first (DockTor ensure_broker), so this exists before any worker.
  bus:
    external: true
    name: apk-audio_default
