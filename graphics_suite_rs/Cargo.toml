[package]
name = "apkaudio-graphics-suite"
version = "0.1.0"
edition = "2021"
description = "Per-file graphics analysis: OCR, image metrics, vectorization, photo id, format plugins, and the micro-API that serves them"

[[bin]]
name = "apkaudio_graphics_suite"
path = "src/main.rs"

[dependencies]
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
tiny_http = "0.12"
zip = "0.6"

[profile.release]
opt-level = 3
