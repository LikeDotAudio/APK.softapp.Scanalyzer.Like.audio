[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# float_roundtrip: extractor Region JSON comes back from the webview and must parse to the
# exact f64 the engine wrote, or `floor(start_seconds * sr)` shifts the cut by a sample
# (LOOSE-wasm-extractor-cut; same flag as wasm_extractor).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# In-process extractor: the same cutting DSP the web build runs as WASM, called natively
# so a desktop scan/slice/analyze never leaves the process. `oa-sample-analyzer` supplies
# the native decoder + the per-chunk UCS analysis.
extractor_engine = { path = "../../../../CAPTURE/CAPTURE.Extractor-Engine" }
oa-sample-analyzer = { path = "../../../../PROCESSOR/PROCESSOR.SampleAnalyzer" }
