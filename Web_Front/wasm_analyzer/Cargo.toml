[package]
name = "wasm_analyzer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
hound = "3.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
oa-sample-analyzer = { path = "../../SCANALYZER:softapps/SCANALIZER.SampleAnalyzer-Engine" }
console_error_panic_hook = "0.1.7"
