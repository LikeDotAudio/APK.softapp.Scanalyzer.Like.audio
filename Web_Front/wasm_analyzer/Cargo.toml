[package]
name = "wasm_analyzer"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
hound = "3.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
# The engine and the analyzer BY COMMIT, not by sibling path (audit 2026-10-30; the house
# rule for a sibling, .apk.scripts/plugin_standalone.py). ONE rev each across wasm_extractor,
# wasm_analyzer and src-tauri (and the analyzer's own pin of the engine), or cargo builds two
# extractor_engine packages with two Region types. In the monorepo the locally excluded
# Web_Front/.cargo/config.toml patches both URLs back to the sibling folders.
oa-sample-analyzer = { git = "https://github.com/LikeDotAudio/APK.softapp.PROCESSOR.SampleAnalyzer", rev = "f7fa01eba78273906d4e70c103d1368dd68339b3" }
console_error_panic_hook = "0.1.7"
