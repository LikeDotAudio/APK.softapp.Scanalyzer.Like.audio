[package]
name = "wasm_extractor"
version = "2.0.0"
edition = "2021"
description = "WASM wrapper for the Extractor cutting engine — region detection, slicing/fades, WAV export, and per-chunk UCS analysis. Mirrors the native path so web and desktop cut identically."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: Region and DetectParams cross the wasm boundary as JSON f64; the default
# fast parser can land one ULP off, which moves `floor(start_seconds * sr)` by a sample
# and the browser cuts a different file than the desktop (LOOSE-wasm-extractor-cut).
serde_json = { version = "1", features = ["float_roundtrip"] }
console_error_panic_hook = "0.1.7"
# The engine and the analyzer BY COMMIT, not by sibling path (audit 2026-10-30; the house
# rule for a sibling, .apk.scripts/plugin_standalone.py). ONE rev each across wasm_extractor,
# wasm_analyzer and src-tauri (and the analyzer's own pin of the engine), or cargo builds two
# extractor_engine packages with two Region types. In the monorepo the locally excluded
# Web_Front/.cargo/config.toml patches both URLs back to the sibling folders.
extractor_engine = { git = "https://github.com/LikeDotAudio/APK.softapp.CAPTURE.Extractor-Engine", rev = "5c55ca5518462d68d9fcbd828465fffbf0c5d79e" }
oa-sample-analyzer = { git = "https://github.com/LikeDotAudio/APK.softapp.PROCESSOR.SampleAnalyzer", rev = "6c81f82174ad3dd05908161dbdc6b031ab8c60f5" }
