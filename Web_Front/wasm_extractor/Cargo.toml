[package]
name = "wasm_extractor"
version = "0.1.0"
edition = "2021"
description = "WASM wrapper for the Extractor cutting engine — region detection, slicing/fades, WAV export, and per-chunk UCS analysis. Mirrors the native path so web and desktop cut identically."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: Region and DetectParams cross the wasm boundary as JSON f64; the default
# fast parser can land one ULP off, which moves `floor(start_seconds * sr)` by a sample
# and the browser cuts a different file than the desktop (LOOSE-wasm-extractor-cut).
serde_json = { version = "1", features = ["float_roundtrip"] }
console_error_panic_hook = "0.1.7"
extractor_engine = { path = "../../../../CAPTURE/CAPTURE.Extractor-Engine" }
oa-sample-analyzer = { path = "../../../../PROCESSOR/PROCESSOR.SampleAnalyzer" }
